<style>
  /* Additional CSS for video styling */
  #video-container {
    position: fixed; /* Keep the video in the corner */
    bottom: 10px;    /* Distance from the bottom */
    right: 10px;     /* Distance from the right */
    width: 200px;    /* Set width */
    height: 150px;   /* Set height */
    border: 2px solid black; /* Optional: border for the video */
    background: black; /* Optional: background color */
    z-index: 1000;   /* Ensure it appears above other elements */
  }

  /* Hide the video element */
  #video {
    width: 100%; /* Full width of the container */
    height: 100%; /* Full height of the container */
  }

  /* CSS for alert box */
  #suspicious-alert {
    display: none; /* Hidden by default */
    position: fixed; /* Fixed position */
    top: 50%; /* Center vertically */
    left: 50%; /* Center horizontally */
    transform: translate(-50%, -50%); /* Adjust position based on element's size */
    z-index: 2000; /* Ensure it appears above other elements */
    background-color: red; /* Alert background color */
    color: white; /* Alert text color */
    padding: 20px 30px; /* Adjust padding for better spacing */
    border-radius: 10px; /* More rounded corners */
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.6); /* Optional shadow */
    text-align: center; /* Center text inside the alert box */
    width: auto; /* Set fixed width for the alert */
    height: auto; /* Allow height to adjust based on content */
    font-size: 18px; /* Increase font size for readability */
  }
</style>
